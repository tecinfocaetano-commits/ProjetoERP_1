plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.erp2026_mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.erp2026_mobile"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Material 3 (tema Material You) - cores dinamicas em Android 12+
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // JDBC/Jaybird removido: o app consome a API REST (ver ApiClient.java)

    // Testes unitarios locais (JVM): SQLite real via Robolectric e servidor
    // HTTP falso. Estas dependencias NAO entram no APK.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
