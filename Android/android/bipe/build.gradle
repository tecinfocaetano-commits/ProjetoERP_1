plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.erp2026_bipe'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.erp2026_bipe"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    // Leitura do código de barras pela câmera (botão "Ler pela câmera").
    // A bipagem principal continua sendo por teclado (leitor USB/BT
    // funciona como teclado + Enter, sem dependência nenhuma).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
